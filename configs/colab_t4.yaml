experiment_name: "colab_t4_qlora"
is_synthetic: false
description: "Colab T4 GPU configuration: Qwen2.5-VL-3B, 4-bit QLoRA, fp16, max_pixels 256*28*28, batch 1 with grad accumulation 8"

model:
  name: "Qwen/Qwen2.5-VL-3B-Instruct"
  type: "qwen2_5_vl"
  torch_dtype: "float16"
  load_in_4bit: true
  max_pixels: 200704  # 256 * 28 * 28
  min_pixels: 3136    # 4 * 28 * 28
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  use_dora: false
  exclude_modules_pattern: ".*visual.*"

data:
  train_path: "data/livevqa_train.jsonl"
  eval_path: "data/livevqa_eval.jsonl"
  mmstar_path: "data/mmstar_eval.jsonl"
  format: "MCQA"
  options_key: "options"
  split_by_image: true
  train_split_ratio: 0.8
  seed: 42

training:
  epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 8  # Effective batch size = 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  fp16: true
  bf16: false
  seed: 42
  max_length: 512

eval:
  batch_size: 1
  temperature: 0.0
  max_new_tokens: 16
