[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livevqa-continual-baseline"
version = "0.1.0"
description = "Baseline and evaluation framework for knowledge updating and continual learning in multimodal LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ML Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "pillow>=9.0.0",
    "pyyaml>=6.0",
    "pandas>=1.5.0",
    "matplotlib>=3.7.0",
    "numpy>=1.22.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]
gpu = [
    "bitsandbytes>=0.43.0",
    "qwen-vl-utils>=0.0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
